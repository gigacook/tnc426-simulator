<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TNC 426 Simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; color: #d7dde4; font: 16px/1.5 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; letter-spacing: .02em; }
  p { margin: .25rem 0; color: #9aa6b2; }
  #err { display: none; max-width: 40rem; text-align: left; background: #2a1416; border: 1px solid #a33; color: #ffd6d6;
         padding: 12px 16px; border-radius: 6px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .9rem; }
  @media (prefers-reduced-motion: no-preference) { .dot { animation: blink 1.2s infinite; } }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<main>
  <h1>TNC 426 / 430 Simulator</h1>
  <p id="msg" role="status">Starting the local server<span class="dot" aria-hidden="true">…</span></p>
  <pre id="err" role="alert"></pre>
</main>
<script src="splash.js"></script>
</body>
</html>
