[package]
name = "tnc-server"
description = "TNC 426/430 simulator server: accounts, versioned program library, tool tables, sharing, AI proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tnc-server"
path = "src/main.rs"

[dependencies]
tnc-formats.workspace = true
tnc-engine.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
